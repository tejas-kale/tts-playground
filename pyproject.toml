[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tts-pg"
version = "0.1.0"
description = "A unified CLI tool for text-to-speech synthesis using ChatterboxTurboTTS and VibeVoice"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Tejas Kale"}
]
keywords = ["tts", "text-to-speech", "chatterbox", "vibevoice", "audio", "synthesis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "click>=8.1.0",
    "rich>=13.7.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pydub>=0.25.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
tts-pg = "tts_pg.cli:cli"

[project.urls]
Homepage = "https://github.com/tejas-kale/tts-playground"
Repository = "https://github.com/tejas-kale/tts-playground"

[tool.hatch.build.targets.wheel]
packages = ["src/tts_pg"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/pyproject.toml",
]
